[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nixpulse"
version = "0.1.0"
description = "NixPulse Ephemeral War Room: Terminal-native autonomous coding flight deck with live agent capabilities, skills engine, and dynamic tmux orchestration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "MLH Hackathon Team" }
]
dependencies = [
    "libtmux",
    "rich",
    "prompt-toolkit",
    "requests",
    "pydantic"
]

[project.scripts]
nixpulse = "nixpulse.cli:main"
nixpulse-daemon = "nixpulse.daemon_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
